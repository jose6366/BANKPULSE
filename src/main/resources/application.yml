server:
  port: ${APP_PORT:8080}
spring:
  application:
    name: bankpulse
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bankpulse}
    username: ${DB_USER:bankpulse}
    password: ${DB_PASSWORD:bankpulse_dev}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  thymeleaf:
    cache: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
