<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>BANKPULSE</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<nav><span class="brand">BANKPULSE</span><a href="/">Inicio</a><a href="/payments/new">Nuevo pago</a><form th:action="@{/logout}" method="post"><button>Salir</button></form></nav>
<main><div th:if="${success}" class="success" th:text="${success}"></div><div th:if="${error}" class="error" th:text="${error}"></div>
<h1>Panel de pagos</h1><div class="grid"><div class="card" th:each="a:${accounts}"><b th:text="${a.accountNumber}"></b><p th:text="${a.owner}"></p><h2>$ <span th:text="${a.balance}"></span></h2></div></div>
<div class="card"><h2>Historial</h2><table><thead><tr><th>Referencia</th><th>Beneficiario</th><th>Monto</th><th>Estado</th><th>Fecha</th></tr></thead><tbody><tr th:each="p:${payments}"><td th:text="${p.reference}"></td><td th:text="${p.beneficiary}"></td><td th:text="${p.amount}"></td><td><span class="badge" th:text="${p.status}"></span></td><td th:text="${p.createdAt}"></td></tr><tr th:if="${#lists.isEmpty(payments)}"><td colspan="5">No hay pagos todavía.</td></tr></tbody></table></div></main></body></html>
