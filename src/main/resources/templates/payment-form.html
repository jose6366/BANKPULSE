<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Nuevo pago</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><nav><span class="brand">BANKPULSE</span><a href="/">Volver</a></nav><main><div class="card"><h1>Nuevo pago</h1><form action="/payments" method="post"><label>Cuenta origen</label><br><select name="sourceAccountId" required><option th:each="a:${accounts}" th:value="${a.id}" th:text="${a.accountNumber + ' - $' + a.balance}"></option></select><br><label>Beneficiario</label><br><input name="beneficiary" required maxlength="120"><br><label>Monto</label><br><input name="amount" type="number" min="0.01" step="0.01" required><br><button type="submit">Confirmar pago</button></form></div></main></body></html>
