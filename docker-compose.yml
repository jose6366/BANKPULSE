services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-bankpulse}
      POSTGRES_USER: ${DB_USER:-bankpulse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bankpulse_dev}
    volumes:
      - bankpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bankpulse} -d ${DB_NAME:-bankpulse}"]
      interval: 5s
      timeout: 3s
      retries: 15
  app:
    build: .
    environment:
      APP_PORT: ${APP_PORT:-8080}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-bankpulse}
      DB_USER: ${DB_USER:-bankpulse}
      DB_PASSWORD: ${DB_PASSWORD:-bankpulse_dev}
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
volumes:
  bankpulse_pgdata:
